# Dedicated development builder, not the Raspberry Pi image.
# Image digest verified against Debian's dated SHA512SUMS.
minimumLimaVersion: "2.0.0"
vmType: vz
arch: aarch64
cpus: 2
memory: 3GiB
disk: 16GiB
images:
  - location: https://cloud.debian.org/images/cloud/trixie/20260712-2537/debian-13-genericcloud-arm64-20260712-2537.qcow2
    arch: aarch64
    digest: sha512:8543d795f2fde630eb66c492f245a8c1da19dedc636e0a8e7b3d0f95920e1a05aa911ef2d82d177d41cc53ced5fccbd2a3945d07fa5e15018914c4d864bb07ed
mounts: []
containerd:
  system: false
  user: false
vmOpts:
  vz:
    rosetta:
      enabled: false
      binfmt: false
ssh:
  forwardAgent: false
portForwards:
  - guestPortRange: [1, 65535]
    guestIP: 0.0.0.0
    guestIPMustBeZero: false
    proto: any
    ignore: true
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      if [ -r /var/lib/inkyos-build/owner ] && \
         [ "$(cat /var/lib/inkyos-build/owner)" = inkyos-builder-v1 ]; then
        exit 0
      fi
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends python3 xz-utils util-linux mount \
        e2fsprogs dosfstools fdisk parted rsync ca-certificates busybox-static
      install -d -m 0755 /var/lib/inkyos-build
      printf '%s\n' inkyos-builder-v1 > /var/lib/inkyos-build/owner
